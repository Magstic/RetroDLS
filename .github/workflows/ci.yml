name: Java

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Compile
        run: sh build.sh
      - name: Self-check
        run: java -cp "out:lib/jlayer-1.0.1.jar" mobilebae.MobileBaeSelfChecks
